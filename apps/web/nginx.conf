server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Immutable hashed assets from Vite
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Service worker / manifest must revalidate
  location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # SPA fallback — /api and /admin never reach this container (Caddy routes them)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
