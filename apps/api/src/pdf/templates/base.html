<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <style>
      {{FONTS}}

      :root {
        --ink: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #1f6f54;
        --bg: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.5;
      }

      h1,
      h2,
      h3 {
        color: var(--ink);
        font-weight: 600;
        margin: 0 0 0.6em;
      }

      h1 {
        font-size: 22px;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 0.85em;
      }

      .muted {
        color: var(--muted);
      }

      .accent {
        color: var(--accent);
      }

      .mono,
      .amount {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin: 1em 0;
      }

      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 0.55em 0.4em;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      td.amount,
      th.amount {
        text-align: right;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }

      .rule {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 1.25em 0;
      }
    </style>
  </head>
  <body>
    {{CONTENT}}
  </body>
</html>
