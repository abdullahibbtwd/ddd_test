services:
  postgres:
    image: postgres:18.7-alpine
    container_name: ddcrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ddcrm
      POSTGRES_PASSWORD: ddcrm
      POSTGRES_DB: ddcrm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddcrm -d ddcrm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.10.3-alpine
    container_name: ddcrm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  garage:
    image: dxflrs/garage:v2.5.0
    container_name: ddcrm-garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK1a8654f7fb58addb3de946bdb93f8ec3
      GARAGE_DEFAULT_SECRET_KEY: a732024340d909fe07cb7b20a7ff68fc97c5f13f0e54f712df4f3360b5dd8fd3
      GARAGE_DEFAULT_BUCKET: ddcrm
    ports:
      - "3900:3900"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  gotenberg:
    image: gotenberg/gotenberg:9.8.0
    container_name: ddcrm-gotenberg
    restart: unless-stopped
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: ddcrm-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data:
