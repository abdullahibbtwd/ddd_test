packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  "@swc/core": true
  prisma: true
  "@prisma/engines": true
  "@scarf/scarf": true
  # Testcontainers (Dockerode / SSH) — needed for disposable Postgres tests
  cpu-features: true
  protobufjs: true
  ssh2: true
  # Argon2id password hashing (native binding)
  argon2: true

trustPolicy: off
minimumReleaseAge: 10080

overrides:
  "@aws-sdk/client-s3": 3.1167.0
  "@aws-sdk/s3-request-presigner": 3.1167.0
  "@jridgewell/resolve-uri": 3.1.2
  "@nestjs/common": 12.5.0
  "@nestjs/core": 12.5.0
  "@nestjs/platform-fastify": 12.5.0
  "@fastify/ajv-compiler": 4.0.7
  "@fastify/proxy-addr": 5.1.2
  "@react-email/components": 1.0.12
  "@react-email/render": 2.3.1
  "@rolldown/pluginutils": 1.1.0
  "@tanstack/query-core": 5.107.1
  "@tanstack/react-query": 5.107.1
  "@tokenizer/inflate": 0.6.0
  "@tybys/wasm-util": 0.10.4
  "@typescript-eslint/eslint-plugin": 8.72.2
  "@typescript-eslint/parser": 8.72.2
  browserslist: 4.29.5
  bullmq: 6.7.5
  cron-parser: 5.10.4
  csstype: 3.2.3
  enhanced-resolve: 5.26.2
  fast-json-stringify: 7.3.5
  nodemailer: 10.5.0
  postcss: 8.5.32
  seroval: 1.8.1
  set-cookie-parser: 3.2.2
  strtok3: 10.7.0
  tapable: 2.3.3
  turbo: 2.11.11
  typescript-eslint: 8.72.2
  update-browserslist-db: 1.3.4
  uuid: 14.0.3
  # Task 9: 1.13.17 was inside minimumReleaseAge (7d) on 2026-11-20
  libphonenumber-js: 1.13.16

peerDependencyRules:
  allowedVersions:
    "@nestjs/common": "12"
    "@nestjs/core": "12"
    "@nestjs/swagger": "12"
